name: Build Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build-windows:
    name: Windows Build
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --config Release --parallel 3

      - name: Package Windows
        run: python .github/scripts/package.py Windows build

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: plugin-windows
          path: dist/Undxd-Windows.zip
          if-no-files-found: error

  build-linux:
    name: Linux Build
    runs-on: ubuntu-24.04
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libx11-dev libxinerama-dev libxext-dev \
            libxrandr-dev libxcursor-dev libfreetype6-dev libwebkit2gtk-4.1-dev \
            libglu1-mesa-dev libjack-dev libsndfile1-dev libgtk-3-dev \
            libfontconfig1-dev xvfb

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel 3

      - name: Package Linux
        run: python .github/scripts/package.py Linux build

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: plugin-linux
          path: dist/Undxd-Linux.zip
          if-no-files-found: error

  build-macos:
    name: macOS Build
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel 3

      - name: Package macOS
        run: python .github/scripts/package.py macOS build

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: plugin-macos
          path: dist/Undxd-macOS.zip
          if-no-files-found: error

  publish-release:
    name: Publish Official Release
    runs-on: ubuntu-latest
    needs:
      - build-windows
      - build-linux
      - build-macos
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: plugin-*
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "Undxd $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag